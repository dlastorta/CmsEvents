name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CmsEvents.sln

      - name: Build
        run: dotnet build CmsEvents.sln --configuration Release --no-restore

      # Unit + Architecture tests use SQLite in-memory / no external deps
      - name: Unit tests
        run: |
          dotnet test tests/CmsEvents.Unit.Tests/CmsEvents.Unit.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit

      - name: Architecture tests
        run: |
          dotnet test tests/CmsEvents.Architecture.Tests/CmsEvents.Architecture.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --results-directory ./TestResults/Architecture

      # Integration tests spin up SQL Server via Testcontainers (requires Docker on the runner)
      - name: Integration tests
        run: |
          dotnet test tests/CmsEvents.Integration.Tests/CmsEvents.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14

  docker-build:
    name: Docker image build (validation only)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CmsEvents.Api/Dockerfile
          push: false
          tags: cmsevents-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
